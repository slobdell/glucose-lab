[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glucose-lab"
version = "0.1.0"
description = "Student diabetes research: variant effect prediction and glucose forecasting"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
